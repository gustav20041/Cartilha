<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco Pós-Clique - TCC Fatec Ourinhos</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 700px; margin: 40px auto; padding: 20px; background-color: #0f172a; color: #f8fafc; }
        .calc-box { background-color: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-bottom: 15px; cursor: pointer; font-size: 1.05em; }
        input[type="checkbox"] { transform: scale(1.3); margin-right: 10px; accent-color: #38bdf8; }
        .result-container { background-color: #0f172a; padding: 20px; border-radius: 8px; margin-top: 25px; border: 1px solid #334155; }
        .header-result { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #pctRiscoTexto { font-size: 2em; margin: 0; font-weight: bold; color: #22c55e; }
        .badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85em; text-transform: uppercase; }
        .progress-bar-container { background-color: #334155; border-radius: 10px; height: 16px; width: 100%; overflow: hidden; margin-bottom: 15px; }
        .progress-bar { height: 100%; width: 15%; background-color: #22c55e; transition: width 0.4s ease, background-color 0.4s ease; }
        .msg-alerta { font-size: 0.95em; color: #cbd5e1; border-top: 1px solid #334155; padding-top: 12px; margin: 0; }
        .btn-voltar { display: inline-block; margin-top: 25px; color: #38bdf8; text-decoration: none; font-weight: bold; }
        .btn-voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="calc-box">
        <h2>Calculadora de Risco Pós-Clique</h2>
        <p style="color: #94a3b8;">Avaliação imediata de ameaça e protocolo dinâmico de contenção.</p>
        
        <form id="calcRiscoForm">
            <label>
                <input type="checkbox" id="chkDownload" onchange="atualizarCalculoRisco()">
                Baixou ou executou algum arquivo desconhecido (*payload*)
            </label>
            <label>
                <input type="checkbox" id="chkSenha" onchange="atualizarCalculoRisco()">
                Inseriu senhas ou dados corporativos na página falsa
            </label>
            <label>
                <input type="checkbox" id="chkRede" onchange="atualizarCalculoRisco()">
                O dispositivo continua conectado à rede interna corporativa
            </label>
        </form>

        <div class="result-container">
            <div class="header-result">
                <div>
                    <span style="font-size: 0.8em; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Nível de Ameaça Estimado</span>
                    <h3 id="pctRiscoTexto">15%</h3>
                </div>
                <div id="statusBadgeRisco" class="badge" style="background-color: #22c55e; color: #000;">Baixo</div>
            </div>

            <div class="progress-bar-container">
                <div id="barraProgresso" class="progress-bar"></div>
            </div>

            <p id="textoOrientacao" class="msg-alerta">Risco controlado. Mantenha a monitorização preventiva.</p>
        </div>

        <a href="README.md" class="btn-voltar">← Voltar para a Cartilha Principal</a>
    </div>

    <script>
    function atualizarCalculoRisco() {
        let risco = 15;
        const download = document.getElementById('chkDownload').checked;
        const senha = document.getElementById('chkSenha').checked;
        const rede = document.getElementById('chkRede').checked;

        if (download) risco += 40;
        if (senha) risco += 35;
        if (rede && (download || senha)) risco += 10;
        if (risco > 100) risco = 100;

        const pctElem = document.getElementById('pctRiscoTexto');
        const badgeElem = document.getElementById('statusBadgeRisco');
        const barraElem = document.getElementById('barraProgresso');
        const orientacaoElem = document.getElementById('textoOrientacao');

        pctElem.innerText = risco + "%";
        barraElem.style.width = risco + "%";

        if (risco >= 70) {
            pctElem.style.color = "#ef4444";
            badgeElem.innerText = "ALTO";
            badgeElem.style.backgroundColor = "#ef4444";
            badgeElem.style.color = "#ffffff";
            barraElem.style.backgroundColor = "#ef4444";
            orientacaoElem.innerText = "Credenciais ou dispositivo corporativo potencialmente comprometidos. Ação de contenção imediata necessária (Isolar rede e acionar SOC).";
        } else if (risco >= 40) {
            pctElem.style.color = "#f59e0b";
            badgeElem.innerText = "MÉDIO";
            badgeElem.style.backgroundColor = "#f59e0b";
            badgeElem.style.color = "#000000";
            barraElem.style.backgroundColor = "#f59e0b";
            orientacaoElem.innerText = "Atenção necessária. Verifique os logs de acesso e altere as credenciais afetadas preventivamente.";
        } else {
            pctElem.style.color = "#22c55e";
            badgeElem.innerText = "BAIXO";
            badgeElem.style.backgroundColor = "#22c55e";
            badgeElem.style.color = "#000000";
            barraElem.style.backgroundColor = "#22c55e";
            orientacaoElem.innerText = "Risco controlado. Mantenha a monitorização preventiva.";
        }
    }
    </script>
</body>
</html>
